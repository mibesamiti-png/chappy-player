name: Build Compatibility APKs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-compat-apks.yml'
      - 'tools/verify_compat_apks.py'
      - 'test/pc_media_vectors_test.dart'
      - 'docs/pc-link-r6b-media-vectors.json'
      - 'sample_apps/pc_control_lab/**'
      - 'lib/**'
      - 'test/browser_url_policy_test.dart'
      - 'test/network_diagnostic_service_test.dart'
      - 'test/network_diagnostic_page_widget_test.dart'
      - 'sample_apps/browser_lab/**'
      - 'tools/test_network_r7_boundary.py'
      # Kotlin CameraX / foreground-service source must compile on PRs too.
      - 'tools/android/**'
      - 'tools/patch_android.py'
      - 'sample_apps/video_recorder/**'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'sample_memo.chappy'
      - 'tools/patch_android.py'
      - '.github/workflows/build-compat-apks.yml'

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android --org dev.chappy .
      - name: Configure Android loopback WebView
        run: python3 tools/patch_android.py
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build separate debug APKs for ARM64, ARM32, and x86-64
        run: flutter build apk --debug --split-per-abi
      - name: Inspect APKs and verify cryptographic signatures
        run: python3 tools/verify_compat_apks.py
      - name: Upload ARM64 APK for Xiaomi 11T Pro
        uses: actions/upload-artifact@v4
        with:
          name: ChappyPlayer-Android-ARM64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: ChappyPlayer-Android-ARM32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload x86-64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ChappyPlayer-Android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: ChappyPlayer-Compatibility-Report
          path: build/app/outputs/flutter-apk/compatibility-report.txt
          if-no-files-found: error
          retention-days: 30
