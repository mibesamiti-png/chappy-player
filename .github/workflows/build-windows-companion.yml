name: Windows Companion Preview

on:
  pull_request:
    paths:
      - "examples/windows_companion/**"
      - "tools/test_windows_companion.py"
      - "tools/test_windows_pairing.py"
      - "tools/test_pc_link_readiness.py"
      - "tools/test_windows_identity.py"
      - "tools/test_windows_verified_history.py"
      - "tools/test_pc_proof.py"
      - "tools/test_mutual_proof_session.py"
      - "tools/test_identity_pairing_v3.py"
      - "examples/windows_companion/identity_proof.py"
      - ".github/workflows/build-windows-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned mDNS and EXE builder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r examples/windows_companion/requirements.txt "pyinstaller>=6.14,<7"
      - name: Validate Windows companion source, consent and ServiceInfo
        run: python tools/test_windows_companion.py
      - name: Test one-session pinned TLS PC confirmation and denial contracts
        run: python tools/test_windows_pairing.py
      - name: Test QR-v3 offline preflight and explicit launch scripts
        run: python tools/test_pc_link_readiness.py
      - name: Exercise real Windows current-user DPAPI P-256 identity lifecycle
        run: python tools/test_windows_identity.py
      - name: Verify P-256 signed challenge is context-bound and never auto-pairs
        run: python tools/test_pc_proof.py
      - name: Check two-sided one-shot proof and approvals under replay/denial
        run: python tools/test_mutual_proof_session.py
      - name: Verify QR-v3 one-time challenge, mutual ECDSA and replay denial
        run: python tools/test_identity_pairing_v3.py
      - name: Test DPAPI-encrypted verification history and local-only CLI consent
        run: python tools/test_windows_verified_history.py
      - name: Build console-only, user-invoked Windows preview
        run: python -m PyInstaller --onefile --console --name ChappyCompanion examples/windows_companion/companion.py
      - name: Verify bundled EXE does not start advertising by default
        shell: pwsh
        run: |
          & ".\dist\ChappyCompanion.exe"
          if ($LASTEXITCODE -ne 0) { throw "Preview self-check failed" }
      - name: Verify offline identity status does not start network listener
        shell: pwsh
        run: |
          & ".\dist\ChappyCompanion.exe" --identity-status
          if ($LASTEXITCODE -ne 0) { throw "DPAPI identity status failed" }
      - name: Verify frozen EXE supports offline doctor with no identity autogeneration
        shell: pwsh
        run: |
          & ".\\dist\\ChappyCompanion.exe" --doctor
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) { throw "Unexpected doctor exit status" }
          # A fresh runner has no PC identity, so an informative exit 1 is expected.
          # Reset the PowerShell step exit code after checking the doctor result.
          exit 0
      - name: Include explicit Windows QR-v3 and offline identity launchers
        shell: pwsh
        run: |
          Copy-Item examples/windows_companion/Start-ChappyCompanion.cmd dist/Start-ChappyCompanion.cmd
          Copy-Item examples/windows_companion/Start-ChappyPairing.cmd dist/Start-ChappyPairing.cmd
          Copy-Item examples/windows_companion/Start-ChappyPairingV3.cmd dist/Start-ChappyPairingV3.cmd
          Copy-Item examples/windows_companion/Start-ChappyKnownPhoneV3.cmd dist/Start-ChappyKnownPhoneV3.cmd
          Copy-Item examples/windows_companion/Start-ChappyIdentitySetup.cmd dist/Start-ChappyIdentitySetup.cmd
      - name: Upload Windows preview (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: chappy-companion-windows-preview
          path: |
            dist/ChappyCompanion.exe
            dist/Start-ChappyCompanion.cmd
            dist/Start-ChappyPairing.cmd
            dist/Start-ChappyPairingV3.cmd
            dist/Start-ChappyKnownPhoneV3.cmd
            dist/Start-ChappyIdentitySetup.cmd
          if-no-files-found: error
