name: Quick CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quick-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify single-chat handoff metadata before expensive setup
        run: python3 tools/test_project_handoff.py
      - name: R4B offline consent and strict protocol preflight
        run: |
          python3 tools/test_pc_link_r4b.py
          python3 tools/test_pc_link_r4b_boundary.py
      - name: R4C live status privacy and JavaScript isolation source gate
        run: python3 tools/test_pc_status_boundary.py
      - name: R5A PC file transfer scoped file and mini-app isolation preflight
        run: python3 tools/test_pc_file_boundary.py
      - name: NETLAB-04A export and 04B scoped Python syntax preflight
        run: |
          python3 tools/test_pc_traffic_export.py
          python3 -m py_compile examples/windows_companion/traffic_once.py examples/windows_companion/pairing_server.py examples/windows_companion/companion.py
      - name: NETLAB-05 strict router HTTPS, per-device privacy and JS isolation preflight
        run: python3 tools/test_router_connection_boundary.py
      - name: NETLAB-05B BUFFALO offline client inventory and unknown device boundary
        run: python3 tools/test_buffalo_inventory_boundary.py
      - name: NETLAB-05C router gateway and UPnP candidate scope safety boundary
        run: python3 tools/test_router_identity_boundary.py
      - name: NETLAB-06A offline PCAP inspection, consent and no-capture boundary
        run: python3 tools/test_pcap_inspection_boundary.py
      - name: R7 host browser URL/security and private Browser Lab preflight
        run: |
          python3 tools/test_network_r7_boundary.py
          python3 tools/test_browser_lab.py
      - name: R6B private PC Control Lab offline-only and zero-permission package checks
        run: python3 tools/test_pc_control_lab.py
      - name: R6A media-key signature and mini-app isolation preflight
        run: python3 tools/test_pc_media_boundary.py
      - name: R5B upload no-clobber and mini-app isolation preflight
        run: python3 tools/test_pc_upload_boundary.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner if absent
        run: flutter create --platforms=android --org dev.chappy .
      - name: Patch Android manifest for local app host
        run: python3 tools/patch_android.py
      - name: Android media permission manifest smoke test
        run: python3 tools/test_android_media_manifest.py
      - name: Macro Lab R1 accessibility scope and no-cross-app regression
        run: python3 tools/test_macro_lab_r1_contract.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Package R5A/R5B private Debug PC Transfer Lab (not public catalog)
        run: |
          python3 tools/pack_html_chappy.py --source sample_apps/pc_transfer_lab --id local.chappy.pc_transfer_lab --name "PC Transfer Lab" --version 0.2.0 --output build/pc-transfer-lab.chappy
          python3 -c "import json,zipfile; z=zipfile.ZipFile('build/pc-transfer-lab.chappy'); m=json.loads(z.read('manifest.json')); assert m['id']=='local.chappy.pc_transfer_lab' and m['permissions']==[] and 'index.html' in z.namelist()"
      - name: Package R6B PC Control Lab private Debug manual QA preview
        run: |
          python3 tools/pack_html_chappy.py --source sample_apps/pc_control_lab --id local.chappy.pc_control_lab --name "PC Control Lab" --version 0.1.0 --output build/pc-control-lab.chappy
          python3 -c "import json,zipfile; z=zipfile.ZipFile('build/pc-control-lab.chappy'); m=json.loads(z.read('manifest.json')); assert m['id']=='local.chappy.pc_control_lab' and m['permissions']==[] and 'index.html' in z.namelist()"
      - name: Package R7 Browser Lab private, zero-permission manual QA
        run: |
          python3 tools/pack_html_chappy.py --source sample_apps/browser_lab --id local.chappy.browser_lab --name "Browser Lab" --version 0.1.0 --output build/browser-lab-r7.chappy
          python3 -c "import json,zipfile; z=zipfile.ZipFile('build/browser-lab-r7.chappy'); m=json.loads(z.read('manifest.json')); assert m['id']=='local.chappy.browser_lab' and m['permissions']==[]"
      - name: Upload Debug PC Transfer Lab preview (no catalog publication)
        uses: actions/upload-artifact@v4
        with:
          name: pc-transfer-lab-debug-preview
          path: build/pc-transfer-lab.chappy
          if-no-files-found: error
      - name: Upload R6B PC Control Lab private QA preview (NOT published)
        uses: actions/upload-artifact@v4
        with:
          name: pc-control-lab-r6b-debug-preview
          path: build/pc-control-lab.chappy
          if-no-files-found: error
      - name: Upload private R7 Browser Lab preview (NOT public catalog)
        uses: actions/upload-artifact@v4
        with:
          name: browser-lab-r7-private-preview
          path: build/browser-lab-r7.chappy
          if-no-files-found: error
      - name: Native microphone bridge security smoke test
        run: python3 tools/test_native_microphone_bridge.py
      - name: Native camera video permission and private storage smoke test
        run: python3 tools/test_native_video_contract.py
      - name: Motion, haptics and private video export safety contracts
        run: python3 tools/test_native_miniapp_capabilities.py
      - name: Game server TLS/WSS policy and sandbox contracts
        run: python3 tools/test_game_network_contract.py
      - name: Example game server protocol and abuse guards
        run: python3 tools/test_game_server_example.py
      - name: Network Lab discovery scope and foreground consent contracts
        run: python3 tools/test_network_lab_contract.py
      - name: Windows Companion opt-in beacon source and scope regression
        run: python3 tools/test_windows_companion.py
      - name: Windows pairing PC approval and TLS pin contract
        run: python3 tools/test_windows_pairing.py
      - name: PC Link offline readiness and QR-v3 launcher safety
        run: python3 tools/test_pc_link_readiness.py
      - name: PC identity isolation, no auto trust, native source contract
        run: python3 tools/test_pc_identity_contract.py
      - name: PC proof-only signing isolation and Kotlin parity contract
        run: python3 tools/test_pc_proof_contract.py
      - name: Encrypted QR-v3 verified-PC history safety contract
        run: python3 tools/test_verified_pc_history_contract.py
      - name: Scoped Android SAF document import/export contract
        run: python3 tools/test_native_documents_contract.py
      - name: Native large binary asset vault boundary and checksum checks
        run: python3 tools/test_native_asset_vault.py
      - name: Optional lossless ZIP compression integrity and ratio fixtures
        run: python3 tools/test_asset_zip_compression.py
      - name: Private video ZIP batch backup integrity/safety contract
        run: python3 tools/test_private_video_zip_backup.py
      - name: Private ZIP restore strict validation and format fixtures
        run: python3 tools/test_private_video_zip_restore.py
      - name: R7 Browser Lab manual checklist simulated JS test
        run: node tools/test_browser_lab.js
      - name: R6B PC Control Lab offline simulated UI test
        run: node tools/test_pc_control_lab.js
      - name: JavaScript bridge smoke test
        run: node tools/test_bootstrap.js
      - name: Release signing helper smoke test
        run: python3 tools/test_release_signing.py
      - name: APK signer output parser smoke test
        run: python3 tools/test_verify_signed_release.py
      - name: HTML package and mini-app catalog smoke test
        run: python3 tools/test_chappy_package_tools.py
      - name: Debug QA checklist logic, status, report, local-only isolation
        run: node tools/test_debug_checklist.js
      - name: Pack public-safe QA checklist Debug mini-app preview (no Stable)
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/debug_checklist \
            --id local.chappy.qa_checklist \
            --name "Chappy QA Checklist" \
            --version 0.1.0 \
            --output build/chappy-qa-checklist-v0.1.0.chappy
          python3 -c "import json,zipfile; z=zipfile.ZipFile('build/chappy-qa-checklist-v0.1.0.chappy'); m=json.loads(z.read('manifest.json')); assert m['id']=='local.chappy.qa_checklist' and m['version']=='0.1.0' and m['permissions']==[] and set(z.namelist())=={'manifest.json','index.html','app.js','README.md'}"
      - name: Upload Debug QA Checklist preview
        uses: actions/upload-artifact@v4
        with:
          name: chappy-qa-checklist-debug-preview
          path: build/chappy-qa-checklist-v0.1.0.chappy
          if-no-files-found: error
      - name: Package ASMR Sound Lab v1.4.5 mini-app preview (unpublished)
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/asmr_sound_lab \
            --id local.chappy.asmr \
            --name "ASMR Sound Lab" \
            --version 1.4.5 \
            --output build/asmr-sound-lab-v1.4.5.chappy
      - name: Upload ASMR mini-app preview (manual QA only)
        uses: actions/upload-artifact@v4
        with:
          name: asmr-sound-lab-v1.4.5-preview
          path: build/asmr-sound-lab-v1.4.5.chappy
          if-no-files-found: error
      - name: Upload ASMR standalone HTML preview (manual QA only)
        uses: actions/upload-artifact@v4
        with:
          name: asmr-sound-lab-v1.4.5-html-preview
          path: sample_apps/asmr_sound_lab/index.html
          if-no-files-found: error
      - name: Update feed generator smoke test
        run: python3 tools/test_update_feed.py
      - name: Public APK feed publisher safety smoke test
        run: python3 tools/test_publish_update_catalog.py
      - name: Media Lab JavaScript syntax and feature smoke test
        run: node tools/test_media_probe.js
      - name: Media Lab copyable diagnostics behavior smoke test
        run: node tools/test_media_lab_diagnostics.js
      - name: Media Lab camera recording and private video library smoke test
        run: node tools/test_media_lab_video.js
      - name: CAMREC-13 smart recording native source and privacy checks
        run: python3 tools/test_motion_recorder_contract.py
      - name: CAMREC-14 screen-off camera FGS consent and privacy checks
        run: python3 tools/test_screenoff_recorder_contract.py
      - name: CAMREC-15 Recorder UX and host-owned recording confirmation contract
        run: python3 tools/test_recorder_ux_contract.py
      - name: Chappy Recorder mini-app smoke test
        run: node tools/test_chappy_recorder.js
      - name: Package Chappy Recorder v0.1.7 private CAMREC-16 Debug preview
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/video_recorder \
            --id local.chappy.recorder \
            --name "Chappy Recorder" \
            --version 0.1.7 \
            --permission camera --permission microphone \
            --output build/chappy-recorder-camrec16-v0.1.7.chappy
          python3 -c "import json,zipfile; z=zipfile.ZipFile('build/chappy-recorder-camrec16-v0.1.7.chappy'); m=json.loads(z.read('manifest.json')); assert m['id']=='local.chappy.recorder' and m['version']=='0.1.7' and m['permissions']==['camera','microphone']"
      - name: Upload Recorder v0.1.7 private Debug QA preview (not public)
        uses: actions/upload-artifact@v4
        with:
          name: chappy-recorder-camrec16-v0.1.7-private-preview
          path: build/chappy-recorder-camrec16-v0.1.7.chappy
          if-no-files-found: error
      - name: Device Lab motion and haptics smoke test
        run: node tools/test_device_lab.js
      - name: Game Server Lab HTTPS and WSS smoke test
        run: node tools/test_game_server_lab.js
      - name: File Lab picker and asset-vault smoke test
        run: node tools/test_file_lab.js
