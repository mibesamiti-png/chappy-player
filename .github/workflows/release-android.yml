name: Build Signed Release APK

# This workflow is intentionally manual. Configure all CHAPPY_* secrets first.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chappy-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org dev.chappy .
      - name: Prepare local WebView host
        run: python3 tools/patch_android.py
      - name: Configure stable release signing
        env:
          CHAPPY_KEYSTORE_B64: ${{ secrets.CHAPPY_KEYSTORE_B64 }}
          CHAPPY_STORE_PASSWORD: ${{ secrets.CHAPPY_STORE_PASSWORD }}
          CHAPPY_KEY_PASSWORD: ${{ secrets.CHAPPY_KEY_PASSWORD }}
          CHAPPY_KEY_ALIAS: ${{ secrets.CHAPPY_KEY_ALIAS }}
        run: python3 tools/configure_release_signing.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build signed APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: chappy-player-signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
