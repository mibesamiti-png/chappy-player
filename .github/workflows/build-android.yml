name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner if absent
        run: flutter create --platforms=android --org dev.chappy .
      - name: Patch Android manifest for local app host
        run: python3 tools/patch_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Apply Dart analyzer-supported fixes
        run: dart fix --apply
      - name: Format sources (CI only)
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: JavaScript bridge smoke test
        run: node tools/test_bootstrap.js
      - name: Build installable APK (debug signed; personal test only)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: chappy-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
