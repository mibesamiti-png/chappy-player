name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner if absent
        run: flutter create --platforms=android --org dev.chappy .
      - name: Patch Android manifest for local app host
        run: python3 tools/patch_android.py
      - name: Android media permission manifest smoke test
        run: python3 tools/test_android_media_manifest.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Native microphone bridge security smoke test
        run: python3 tools/test_native_microphone_bridge.py
      - name: Native camera video permission and private storage smoke test
        run: python3 tools/test_native_video_contract.py
      - name: JavaScript bridge smoke test
        run: node tools/test_bootstrap.js
      - name: Release signing helper smoke test
        run: python3 tools/test_release_signing.py
      - name: APK signer output parser smoke test
        run: python3 tools/test_verify_signed_release.py
      - name: HTML package and mini-app catalog smoke test
        run: python3 tools/test_chappy_package_tools.py
      - name: Update feed generator smoke test
        run: python3 tools/test_update_feed.py
      - name: Public APK feed publisher safety smoke test
        run: python3 tools/test_publish_update_catalog.py
      - name: Dedicated Debug release publishing safety checks
        run: python3 tools/test_debug_release_flow.py
      - name: Media Lab JavaScript syntax and feature smoke test
        run: node tools/test_media_probe.js
      - name: Media Lab copyable diagnostics behavior smoke test
        run: node tools/test_media_lab_diagnostics.js
      - name: Media Lab camera recording and private video library smoke test
        run: node tools/test_media_lab_video.js
      - name: Package Chappy Media Lab demo
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/media_probe \
            --id local.chappy.media_probe \
            --name 'Chappy Media Lab' \
            --version 0.1.6 \
            --permission camera --permission microphone \
            --output media-probe.chappy
      - name: Upload Chappy Media Lab demo package
        uses: actions/upload-artifact@v4
        with:
          name: chappy-media-probe
          path: media-probe.chappy
          if-no-files-found: error
      - name: Verify isolated debug APK preparation on both Gradle formats
        run: python3 tools/test_prepare_debug_variant.py
      - name: Separate debug app from the installed permanently signed release
        run: python3 tools/prepare_debug_variant.py
      - name: Exercise dedicated Debug signing with a disposable CI-only key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/chappy-ci-debug.jks" \
            -alias chappyci -keyalg RSA -keysize 2048 -validity 2 -storetype PKCS12 \
            -storepass 'ci-temporary-only' -keypass 'ci-temporary-only' \
            -dname 'CN=Chappy temporary CI test key' -noprompt
          keytool -exportcert -keystore "$RUNNER_TEMP/chappy-ci-debug.jks" \
            -alias chappyci -storepass 'ci-temporary-only' \
            -file "$RUNNER_TEMP/chappy-ci-debug.der"
          export CHAPPY_DEBUG_KEYSTORE_B64="$(base64 -w0 "$RUNNER_TEMP/chappy-ci-debug.jks")"
          export CHAPPY_DEBUG_STORE_PASSWORD='ci-temporary-only'
          export CHAPPY_DEBUG_KEY_PASSWORD='ci-temporary-only'
          export CHAPPY_DEBUG_KEY_ALIAS='chappyci'
          export CHAPPY_DEBUG_CERT_SHA256="$(sha256sum "$RUNNER_TEMP/chappy-ci-debug.der" | cut -d ' ' -f 1)"
          python3 tools/configure_debug_release_signing.py
          echo "CHAPPY_DEBUG_CERT_SHA256=$CHAPPY_DEBUG_CERT_SHA256" >> "$GITHUB_ENV"
          echo "CHAPPY_DEBUG_VERSION=0.1.0" >> "$GITHUB_ENV"
          echo "CHAPPY_DEBUG_BUILD_NUMBER=1" >> "$GITHUB_ENV"
      - name: Build installable APK (ephemeral CI signature, not distributable updates)
        run: flutter build apk --debug
      - name: Verify Debug APK package ID, versionCode and actual test signer
        run: python3 tools/verify_debug_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: chappy-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
