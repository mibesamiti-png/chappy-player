name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner if absent
        run: flutter create --platforms=android --org dev.chappy .
      - name: Patch Android manifest for local app host
        run: python3 tools/patch_android.py
      - name: Android media permission manifest smoke test
        run: python3 tools/test_android_media_manifest.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Native microphone bridge security smoke test
        run: python3 tools/test_native_microphone_bridge.py
      - name: Native camera video permission and private storage smoke test
        run: python3 tools/test_native_video_contract.py
      - name: Motion, haptics and private video export safety contracts
        run: python3 tools/test_native_miniapp_capabilities.py
      - name: Scoped Android SAF document import/export contract
        run: python3 tools/test_native_documents_contract.py
      - name: Native large binary asset vault boundary and checksum checks
        run: python3 tools/test_native_asset_vault.py
      - name: Private video ZIP batch backup integrity/safety contract
        run: python3 tools/test_private_video_zip_backup.py
      - name: Private ZIP restore strict validation and format fixtures
        run: python3 tools/test_private_video_zip_restore.py
      - name: JavaScript bridge smoke test
        run: node tools/test_bootstrap.js
      - name: Release signing helper smoke test
        run: python3 tools/test_release_signing.py
      - name: APK signer output parser smoke test
        run: python3 tools/test_verify_signed_release.py
      - name: HTML package and mini-app catalog smoke test
        run: python3 tools/test_chappy_package_tools.py
      - name: Update feed generator smoke test
        run: python3 tools/test_update_feed.py
      - name: Public APK feed publisher safety smoke test
        run: python3 tools/test_publish_update_catalog.py
      - name: Media Lab JavaScript syntax and feature smoke test
        run: node tools/test_media_probe.js
      - name: Media Lab copyable diagnostics behavior smoke test
        run: node tools/test_media_lab_diagnostics.js
      - name: Media Lab camera recording and private video library smoke test
        run: node tools/test_media_lab_video.js
      - name: Package Chappy Media Lab demo
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/media_probe \
            --id local.chappy.media_probe \
            --name 'Chappy Media Lab' \
            --version 0.1.6 \
            --permission camera --permission microphone \
            --output media-probe.chappy
      - name: Upload Chappy Media Lab demo package
        uses: actions/upload-artifact@v4
        with:
          name: chappy-media-probe
          path: media-probe.chappy
          if-no-files-found: error
      - name: Chappy Recorder isolated mini-app smoke test
        run: node tools/test_chappy_recorder.js
      - name: Native motion and haptics demo app smoke test
        run: node tools/test_device_lab.js
      - name: File Lab user-picked documents smoke test
        run: node tools/test_file_lab.js
      - name: Package standalone Chappy Recorder
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/video_recorder \
            --id local.chappy.recorder \
            --name 'Chappy Recorder' \
            --version 0.1.3 \
            --permission camera --permission microphone \
            --output chappy-recorder.chappy
      - name: Upload Chappy Recorder mini-app
        uses: actions/upload-artifact@v4
        with:
          name: chappy-recorder-miniapp
          path: chappy-recorder.chappy
          if-no-files-found: error
      - name: Package Chappy Device Lab (motion and haptics)
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/device_lab \
            --id local.chappy.device_lab \
            --name 'Chappy Device Lab' \
            --version 0.1.0 \
            --permission motion --permission haptics \
            --output chappy-device-lab.chappy
      - name: Upload Chappy Device Lab
        uses: actions/upload-artifact@v4
        with:
          name: chappy-device-lab
          path: chappy-device-lab.chappy
          if-no-files-found: error
      - name: Package Chappy File Lab (user-selected text and JSON)
        run: |
          python3 tools/pack_html_chappy.py \
            --source sample_apps/file_lab \
            --id local.chappy.file_lab \
            --name 'Chappy File Lab' \
            --version 0.2.1 \
            --permission files \
            --output chappy-file-lab.chappy
      - name: Upload Chappy File Lab
        uses: actions/upload-artifact@v4
        with:
          name: chappy-file-lab
          path: chappy-file-lab.chappy
          if-no-files-found: error
      - name: Verify isolated debug APK preparation on both Gradle formats
        run: python3 tools/test_prepare_debug_variant.py
      - name: Separate debug app from the installed permanently signed release
        run: python3 tools/prepare_debug_variant.py
      - name: Build installable APK (debug signed; side-by-side personal test only)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: chappy-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
