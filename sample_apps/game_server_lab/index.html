<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chappy Game Server Lab</title>
<style>
:root{color-scheme:dark;background:#0c1420;color:#eef5ff;font:15px/1.5 system-ui}
*{box-sizing:border-box}body{margin:0 auto;max-width:680px;padding:20px}
h1{margin:4px 0 8px;font-size:24px}h2{font-size:17px;margin:0 0 12px}
p,small{color:#adbed4}section{border:1px solid #344c69;background:#19283b;
border-radius:16px;padding:16px;margin:14px 0}
input,textarea,select{width:100%;background:#0d1828;color:#fff;
border:1px solid #4c6689;border-radius:9px;padding:10px;font:inherit}
textarea{min-height:70px;resize:vertical}
button{padding:10px 12px;margin:6px 6px 6px 0;border-radius:10px;
border:1px solid #6a95c5;background:#2e557d;color:#fff;font:inherit}
button:disabled{opacity:.4}.row{display:flex;gap:6px;flex-wrap:wrap}
label{display:block;margin:10px 0 4px;color:#cfddf0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;
background:#0b1423;padding:12px;border-radius:10px;min-height:75px;max-height:280px;overflow:auto}
#state{color:#b6d6ff;font-weight:650}
</style></head><body>
<h1>Chappy Game Server Lab</h1>
<p>自分のゲームサーバーに接続するための、安全な通信テスト用ミニアプリ。</p>
<section>
<h2>リアルタイム接続（WSS）</h2>
<label for="wssUrl">暗号化WebSocketサーバー（自分で指定）</label>
<input id="wssUrl" type="url" placeholder="wss://your-game.example.org/room"
 autocomplete="off" maxlength="1400">
<div class="row"><button id="connect">サーバーに接続</button>
<button id="disconnect">切断</button></div>
<p id="state" role="status">未接続</p>
<label for="message">送信するテキスト／JSON（8KiBまで）</label>
<textarea id="message" maxlength="8000">{"type":"ping"}</textarea>
<div class="row"><button id="send">メッセージ送信</button>
<button id="sendGravity">今の重力センサー値を送る</button>
<button id="haptic">振動を手動テスト</button></div>
<small>接続はユーザーが指定したサーバーへのみ。受信データは表示だけで、カメラ・ファイル・振動などを勝手に実行しません。</small>
</section>
<section>
<h2>HTTPS APIテスト</h2>
<label for="httpsUrl">HTTPS API URL</label>
<input id="httpsUrl" type="url" placeholder="https://your-game.example.org/status"
 autocomplete="off" maxlength="1400">
<div class="row"><button id="get">GETで取得</button>
<button id="post">POSTでJSON送信</button></div>
<small>リダイレクトは禁止。リクエストは8KiB、レスポンスは64KiB以下。平文HTTP/WSやローカルIPへの接続はこの段階では不可。</small>
</section>
<section><h2>通信ログ（この画面だけ）</h2>
<pre id="log" aria-live="polite">まだ通信していません。</pre>
<button id="clearLog">表示を消す</button>
</section>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id);
  const net=window.Chappy && window.Chappy.network;
  let connected=false, polling=null, busy=false;
  const lines=[];
  function addLog(line){
    lines.push(String(line).slice(0,1200));
    if(lines.length>50)lines.shift();
    $('log').textContent=lines.join('\n');
  }
  function status(text){$('state').textContent=text;}
  function stopPolling(){
    if(polling!==null){clearInterval(polling);polling=null;}
    connected=false;
    status('未接続');
  }
  async function poll(){
    if(!connected || !net || busy)return;
    busy=true;
    try{
      const result=await net.poll();
      for(const message of (result.messages||[])){
        addLog('受信: '+String(message).slice(0,800));
      }
      if(Number(result.dropped)>0)status('接続中（古いメッセージ破棄 '+result.dropped+' 件）');
      if(!result.connected)stopPolling();
    }catch(error){addLog('受信エラー: '+String(error.message||error));stopPolling();}
    finally{busy=false;}
  }
  async function operate(id, action){
    const button=$(id);
    button.disabled=true;
    try{await action();}catch(error){addLog('エラー: '+String(error.message||error));}
    finally{button.disabled=false;}
  }
  $('connect').addEventListener('click',()=>{
    void operate('connect',async()=>{
      if(!net)throw new Error('新しいChappy Playerが必要です');
      if(connected)throw new Error('先に切断してください');
      const url=$('wssUrl').value.trim();
      status('接続を確認中…');
      const result=await net.connect(url);
      if(result.connected){
        connected=true;
        status('接続中');
        addLog('接続成功: '+result.origin);
        polling=setInterval(()=>{void poll();},450);
      }else status('接続できませんでした');
    });
  });
  $('disconnect').addEventListener('click',()=>{
    void operate('disconnect',async()=>{
      stopPolling();
      if(net)await net.close();
      addLog('切断しました');
    });
  });
  $('send').addEventListener('click',()=>{
    void operate('send',async()=>{
      if(!net || !connected)throw new Error('サーバー未接続');
      const text=$('message').value;
      const sent=await net.send(text);
      addLog(sent?'送信: '+text.slice(0,500):'送信失敗（未接続）');
    });
  });
  $('sendGravity').addEventListener('click',()=>{
    void operate('sendGravity',async()=>{
      if(!net || !connected)throw new Error('サーバー未接続');
      const motion=window.Chappy && window.Chappy.motion;
      if(!motion)throw new Error('重力センサーAPIが必要です');
      const reading=await motion.sample('gravity');
      if(!reading.available)throw new Error('重力センサー非対応');
      const message=JSON.stringify({type:'gravity',values:reading.values});
      const sent=await net.send(message);
      addLog(sent?'重力入力を手動送信':'入力送信失敗');
    });
  });
  $('haptic').addEventListener('click',()=>{
    void operate('haptic',async()=>{
      const haptics=window.Chappy && window.Chappy.haptics;
      if(!haptics)throw new Error('振動APIが必要です');
      const ok=await haptics.play('tick');
      addLog(ok?'手動振動：成功':'手動振動：非対応／制限中');
    });
  });
  for(const method of ['get','post']){
    $(method).addEventListener('click',()=>{
      void operate(method,async()=>{
        if(!net)throw new Error('新しいChappy Playerが必要です');
        const body=method==='post' ? $('message').value:'';
        const answer=await net.request($('httpsUrl').value.trim(),
          method.toUpperCase(),body);
        addLog('HTTPS '+method.toUpperCase()+' '+answer.status+
          '：'+String(answer.text).slice(0,800));
      });
    });
  }
  $('clearLog').addEventListener('click',()=>{lines.length=0;$('log').textContent='';});
  if(typeof document.addEventListener==='function'){
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){
        stopPolling();
        if(net)void net.close().catch(()=>{});
      }
    });
  }
})();
</script></body></html>
