<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chappy Device Lab</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0c1422;color:#eef5ff}
body{margin:0;padding:22px;max-width:620px;margin-inline:auto}
header{margin:10px 0 28px}h1{margin:0;font-size:25px}
p{color:#a7b7d0;line-height:1.7}
section{background:#182438;border:1px solid #334560;border-radius:18px;padding:20px;margin:15px 0}
h2{margin:0 0 12px;font-size:17px}
button{margin:4px;border:1px solid #4b6486;background:#2e4565;color:#fff;
border-radius:12px;padding:13px 15px;font-size:14px}
button:disabled{opacity:.45}button:focus-visible{outline:2px solid #9fd1ff}
pre{background:#111a28;border-radius:12px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#92a8c5}
#tiltPad{position:relative;width:min(100%,260px);height:160px;background:#0c1727;border:1px solid #4b6486;border-radius:14px;overflow:hidden;margin:10px 0}
#tiltDot{position:absolute;left:calc(50% - 12px);top:calc(50% - 12px);width:24px;height:24px;border-radius:50%;background:#67c5ff;transition:transform .12s linear}
#tiltStatus{min-height:20px;font-size:13px}
</style></head><body>
<header><h1>Chappy Device Lab</h1>
<p>動きセンサーと振動のネイティブ実験室。初回のみ利用確認が表示されます。</p></header>
<section><h2>端末の動きセンサー</h2>
<button data-sensor="accelerometer">加速度 XYZ</button>
<button data-sensor="gyroscope">ジャイロ XYZ</button>
<button data-sensor="magnetometer">磁気 XYZ</button>
<button data-sensor="gravity">重力 XYZ</button>
<button data-sensor="linearAcceleration">線形加速度 XYZ</button>
<button id="probeSensors">搭載センサーを確認</button>
<pre id="sensorResult">ボタンを押すと、センサーを1回だけ読み取ります。</pre>
<small>アプリ画面が前面にあるときだけ測定。位置情報やGPSは取得しません。連続ログ保存は行いません。</small>
<div id="tiltPad" aria-label="重力センサーのゲーム入力テスト"><div id="tiltDot"></div></div>
<button id="tiltToggle" type="button">傾き操作を開始</button>
<p id="tiltStatus">重力センサーで青い球を動かすテストです（約5Hz、記録・送信なし）。</p>
</section>
<section><h2>触覚・振動テスト</h2>
<button data-haptic="tick">軽い振動</button>
<button data-haptic="click">クリック</button>
<button data-haptic="heavy">強いクリック</button>
<button id="probeHaptics" type="button">振動モーターを確認</button>
<pre id="hapticResult">振動を試すボタンを押してください。</pre>
<small>端末の対応状況により振動の強さが変わります。振動の連続再生は制限されています。</small>
</section>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id);
  const capabilities=window.Chappy || {};
  $('probeSensors').addEventListener('click',async()=>{
    try{
      const available=await capabilities.motion.available();
      $('sensorResult').textContent=Object.keys(available).map(k=>
        k+': '+(available[k]?'対応':'非対応')).join('\n');
    }catch(e){$('sensorResult').textContent='対応状況の取得失敗: '+String(e.message||e);}
  });
  $('probeHaptics').addEventListener('click',async()=>{
    try{
      const available=await capabilities.haptics.available();
      $('hapticResult').textContent=available?'振動モーター搭載':'振動モーターなし／使用不可';
    }catch(e){$('hapticResult').textContent='対応状況の取得失敗: '+String(e.message||e);}
  });
  let tiltTimer=null,tiltReading=false;
  function stopTilt(){
    if(tiltTimer!==null){clearInterval(tiltTimer);tiltTimer=null;}
    $('tiltToggle').textContent='傾き操作を開始';
  }
  async function updateTilt(){
    if(tiltReading || (document.hidden===true)){if(document.hidden===true)stopTilt();return;}
    tiltReading=true;
    try{
      const result=await capabilities.motion.sample('gravity');
      if(!result.available){$('tiltStatus').textContent='重力センサー非対応';stopTilt();return;}
      const xyz=result.values||[0,0,0];
      const x=Math.max(-90,Math.min(90,Number(xyz[0])*9));
      const y=Math.max(-55,Math.min(55,Number(xyz[1])*5.5));
      $('tiltDot').style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
      $('tiltStatus').textContent='傾き入力: X='+Number(xyz[0]).toFixed(2)+' / Y='+Number(xyz[1]).toFixed(2);
    }catch(e){$('tiltStatus').textContent='取得失敗: '+String(e.message||e);stopTilt();}
    finally{tiltReading=false;}
  }
  $('tiltToggle').addEventListener('click',()=>{
    if(tiltTimer!==null){stopTilt();return;}
    if(!capabilities.motion){$('tiltStatus').textContent='対応プレイヤーが必要';return;}
    $('tiltToggle').textContent='傾き操作を停止';
    tiltTimer=setInterval(()=>{void updateTilt();},200);
    void updateTilt();
  });
  if(typeof document.addEventListener==='function'){
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)stopTilt();
    });
  }
  for(const button of document.querySelectorAll('[data-sensor]')){
    button.addEventListener('click',async()=>{
      if(!capabilities.motion){$('sensorResult').textContent='対応プレイヤーの更新が必要です。';return;}
      button.disabled=true;
      try{
        const sample=await capabilities.motion.sample(button.dataset.sensor);
        if(!sample.available){
          $('sensorResult').textContent=button.dataset.sensor+': この端末では非対応';
        }else{
          const axis=sample.values || [];
          $('sensorResult').textContent=button.dataset.sensor+'\n' +
            ['X','Y','Z'].map((name,i)=>name+' = '+Number(axis[i]).toFixed(3)).join('\n')+
            '\n精度: '+sample.accuracy;
        }
      }catch(e){$('sensorResult').textContent='取得失敗: '+String(e.message||e);}
      finally{button.disabled=false;}
    });
  }
  for(const button of document.querySelectorAll('[data-haptic]')){
    button.addEventListener('click',async()=>{
      if(!capabilities.haptics){$('hapticResult').textContent='対応プレイヤーの更新が必要です。';return;}
      button.disabled=true;
      try{
        const ok=await capabilities.haptics.play(button.dataset.haptic);
        $('hapticResult').textContent=ok?'振動を実行しました':'非対応または短時間の連続振動制限中です';
      }catch(e){$('hapticResult').textContent='振動できません: '+String(e.message||e);}
      finally{button.disabled=false;}
    });
  }
})();
</script></body></html>
