name: chappy_player
description: Personal offline mini-app player for .chappy packages.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: 4.5.2
  file_picker: 10.3.10
  path: 1.9.1
  path_provider: 2.1.5
  webview_flutter: 4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - sample_memo.chappy
